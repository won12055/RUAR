[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ruar"
version = "0.1.0"
description = "RUAR: Utility-Guided Advantage Rescaling for Efficient Reasoning"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["ruar", "ruar.*", "ruar_eval", "ruar_eval.*", "ruar_training", "ruar_training.*", "verl", "verl.*"]

[tool.setuptools.package-data]
ruar_training = ["config/*.yaml"]
verl = ["trainer/config/*.yaml", "trainer/*.yaml", "version/*"]
